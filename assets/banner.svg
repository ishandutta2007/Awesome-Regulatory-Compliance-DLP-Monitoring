<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#1b263b" />
    </linearGradient>

    <!-- Glow & Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Filter for subtle drop-shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 42px;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 18px;
        fill: #94a3b8;
        letter-spacing: 0.2px;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #38bdf8;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }
      
      /* Subtle animations */
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.04); }
      }
      @keyframes floatCard {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes scanLine {
        0% { transform: translateY(0); opacity: 0; }
        20% { opacity: 0.8; }
        80% { opacity: 0.8; }
        100% { transform: translateY(180px); opacity: 0; }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -40; }
      }

      .pulse-bg {
        transform-origin: 980px 210px;
        animation: pulseGlow 6s ease-in-out infinite;
      }
      .float-1 {
        animation: floatCard 4s ease-in-out infinite;
      }
      .float-2 {
        animation: floatCard 5s ease-in-out infinite reverse;
      }
      .float-3 {
        animation: floatCard 4.5s ease-in-out 1s infinite;
      }
      .scan-anim {
        animation: scanLine 3.5s linear infinite;
      }
      .stream-line {
        stroke-dasharray: 6 6;
        animation: dashMove 2s linear infinite;
      }
    </style>
  </defs>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Blueprint Tech Grid in Background -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <path d="M 0 70 L 1200 70 M 0 140 L 1200 140 M 0 210 L 1200 210 M 0 280 L 1200 280 M 0 350 L 1200 350" />
    <path d="M 120 0 L 120 420 M 240 0 L 240 420 M 360 0 L 360 420 M 480 0 L 480 420 M 600 0 L 600 420 M 720 0 L 720 420 M 840 0 L 840 420 M 960 0 L 960 420 M 1080 0 L 1080 420" />
  </g>

  <!-- Background Ambient Glow Behind Right-side Graphic -->
  <circle cx="980" cy="210" r="160" fill="#0284c7" filter="url(#glow)" class="pulse-bg" />
  <circle cx="860" cy="140" r="90" fill="#6366f1" filter="url(#glow)" class="pulse-bg" style="animation-delay: -2s;" />

  <!-- Connecting Animated Data Lines between nodes -->
  <g stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.4" class="stream-line">
    <path d="M 800 210 C 860 150, 880 140, 950 140" />
    <path d="M 950 140 C 1020 140, 1040 250, 1100 260" />
    <path d="M 800 210 C 860 270, 900 290, 970 290" />
  </g>

  <!-- Right Visual Graphics: Interactive Architecture Cards & Shield -->
  <g id="interactive-graphic">
    <!-- Big Security Shield Centerpiece -->
    <path d="M 970 120 L 1040 150 V 215 C 1040 260, 970 295, 970 295 C 970 295, 900 260, 900 215 V 150 Z" 
          fill="url(#shieldGrad)" stroke="#38bdf8" stroke-width="2.5" />
    
    <!-- Shield Check Icon -->
    <path d="M 945 205 L 965 225 L 1000 185" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Scanning beam inside shield -->
    <g clip-path="url(#shieldClip)">
      <line x1="900" y1="130" x2="1040" y2="130" stroke="#38bdf8" stroke-width="3" opacity="0.8" class="scan-anim" filter="url(#glow)" />
    </g>

    <!-- Floating Metric Card 1: Compliance Verified -->
    <g class="float-1" filter="url(#cardShadow)">
      <rect x="760" y="85" width="185" height="68" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <circle cx="788" cy="119" r="16" fill="#065f46" />
      <path d="M 781 119 L 786 124 L 795 114" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" />
      <text x="815" y="112" font-family="system-ui" font-size="11" font-weight="700" fill="#94a3b8">AUDIT READINESS</text>
      <text x="815" y="132" font-family="system-ui" font-size="14" font-weight="700" fill="#34d399">100% Continuous</text>
    </g>

    <!-- Floating Metric Card 2: DLP Inspection -->
    <g class="float-2" filter="url(#cardShadow)">
      <rect x="990" y="270" width="175" height="68" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <circle cx="1018" cy="304" r="16" fill="#1e1b4b" />
      <path d="M 1012 304 C 1012 300, 1024 300, 1024 304 C 1024 308, 1012 308, 1012 304" stroke="#a78bfa" stroke-width="2" fill="none" />
      <circle cx="1018" cy="304" r="3" fill="#38bdf8" />
      <text x="1045" y="297" font-family="system-ui" font-size="11" font-weight="700" fill="#94a3b8">DLP SCANNER</text>
      <text x="1045" y="317" font-family="system-ui" font-size="14" font-weight="700" fill="#38bdf8">PII &amp; Secrets Zero-Leak</text>
    </g>

    <!-- Floating Metric Card 3: Framework Coverage -->
    <g class="float-3" filter="url(#cardShadow)">
      <rect x="740" y="245" width="170" height="65" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <circle cx="765" cy="277" r="14" fill="#312e81" />
      <text x="765" y="282" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="bold" fill="#818cf8">✓</text>
      <text x="790" y="270" font-family="system-ui" font-size="11" font-weight="700" fill="#94a3b8">FRAMEWORKS</text>
      <text x="790" y="290" font-family="system-ui" font-size="13" font-weight="700" fill="#f8fafc">SOC 2 · ISO · HIPAA</text>
    </g>
  </g>

  <!-- Left Content (Title, Subtitle, Tags) - Prominently positioned in Foreground -->
  <g transform="translate(60, 0)">
    <!-- Top Pill / Badge -->
    <g transform="translate(0, 68)">
      <rect width="265" height="30" rx="15" fill="#0369a1" fill-opacity="0.25" stroke="#0ea5e9" stroke-width="1.2" />
      <circle cx="15" cy="15" r="4.5" fill="#38bdf8">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="28" y="20" class="badge-text">ENTERPRISE SECURITY &amp; GRC</text>
    </g>

    <!-- Title Header -->
    <text x="0" y="150" class="title-text">
      Regulatory Compliance &amp;
    </text>
    <text x="0" y="202" class="title-text" fill="url(#primaryGrad)">
      DLP Monitoring
    </text>

    <!-- Subtitle / Value Proposition -->
    <text x="0" y="246" class="subtitle-text">
      Curated index of Enterprise GRC SaaS suites &amp; Open-Source tools
    </text>
    <text x="0" y="272" class="subtitle-text" font-size="16" fill="#64748b">
      Continuous evidence automation, real-time sensitive data discovery &amp; PII sanitization.
    </text>

    <!-- Framework & Feature Pills -->
    <g transform="translate(0, 316)">
      <!-- Pill 1: SOC 2 -->
      <g transform="translate(0, 0)">
        <rect width="78" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
        <text x="39" y="21" text-anchor="middle" class="pill-text">SOC 2</text>
      </g>
      <!-- Pill 2: ISO 27001 -->
      <g transform="translate(90, 0)">
        <rect width="98" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
        <text x="49" y="21" text-anchor="middle" class="pill-text">ISO 27001</text>
      </g>
      <!-- Pill 3: HIPAA -->
      <g transform="translate(200, 0)">
        <rect width="75" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
        <text x="37.5" y="21" text-anchor="middle" class="pill-text">HIPAA</text>
      </g>
      <!-- Pill 4: GDPR & CCPA -->
      <g transform="translate(287, 0)">
        <rect width="118" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
        <text x="59" y="21" text-anchor="middle" class="pill-text">GDPR / CCPA</text>
      </g>
      <!-- Pill 5: PII & Secrets DLP -->
      <g transform="translate(417, 0)">
        <rect width="138" height="32" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="1.2" />
        <text x="69" y="21" text-anchor="middle" class="pill-text" fill="#38bdf8">PII &amp; Secrets DLP</text>
      </g>
    </g>
  </g>
</svg>
